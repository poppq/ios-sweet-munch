name: mac
on:
  push:
    paths: ['.github/workflows/mac.yml']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: list xcodes
        run: |
          echo "== installed:"; ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          echo "== active:"; xcodebuild -version || true
          for x in /Applications/Xcode*.app; do echo "--- $x"; defaults read "$x/Contents/Info.plist" CFBundleShortVersionString 2>/dev/null || true; done
          echo "== iig:"; xcrun --find iig || true; xcrun iig --version 2>&1 | head -3 || true
          echo "== runner image:"; sw_vers; echo "ImageVersion=$ImageVersion"
